<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#17291e" />
  <meta name="description" content="Random, playable Travis-picking practice patterns on a drum-machine grid." />
  <title>Travis Picker</title>

  <!-- PWA: installable + offline. iOS mostly ignores the manifest, so the
       apple-* tags and apple-touch-icon below are what actually make the
       home-screen install (standalone launch + icon) work on iPhone. -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Travis" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main>
    <!-- Header, TWO rows: capo state + the four pattern actions, then the name
         on its own line. It was one row from v2.10.2 (that collapse is what paid
         for moving the musical context above the grid), and the name came back
         down in v2.11.0 when the Guide became a fourth pill: with a capo set,
         the name was left 35px of a 351px row. It now has the full width in
         every state. Measured at 4 bars — see the .app-head comment in the CSS
         for what the second row costs on each screen size. -->
    <header class="app-head">
      <div class="ctx-row">
        <!-- Capo state, top-LEFT and in the same place in both chord modes. Only
             exists when a capo is set, so the default screen is untouched. -->
        <span id="capo-tag" class="capo-tag" data-help="capo-tag" hidden></span>
        <div class="grid-actions">
          <!-- Icon-only (v2.8.2): the three pills were the last text controls in an
               app that otherwise speaks in glyphs, and their labels were eating the
               header width the context readout needs — dropping them frees ~58px,
               which is what keeps even a 4-accidental custom progression at full
               14px instead of shrinking to 11.7px. Engraved like the gear and die.
               `title` carries the words (and the saved count) for a long-press. -->
          <button id="edit-toggle" class="pill pill-icon" type="button" aria-pressed="false" data-help="edit-toggle"
                  aria-label="Edit pattern" title="Toggle manual editing"><span class="rec-lamp" aria-hidden="true"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zm17.71-10.21a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></button>
          <button id="open-save" class="pill pill-icon" type="button" data-help="open-save"
                  aria-label="Save pattern" title="Save"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-4-4zm-5 16a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm3-10H5V5h10v4z"/></svg></button>
          <button id="open-load" class="pill pill-icon" type="button" data-help="open-load"
                  aria-label="Load pattern" title="Load"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8l-2-2z"/></svg></button>
          <!-- The Guide moved here from the Options sheet (v2.11.0): it was the
               only ACTION in there wearing a field label, and help belongs with
               the app's other always-reachable actions, not on a settings page. -->
          <button id="open-help" class="pill pill-icon pill-help" type="button"
                  aria-pressed="false" data-help="help-mode"
                  aria-label="Help mode: tap anything to see what it does"
                  title="Help">?</button>
        </div>
      </div>
      <div class="name-row" data-help="loaded-name">
        <span id="loaded-name" class="loaded-name"></span>
      </div>
    </header>

    <div class="stage">
      <!-- ONE slot above the grid says what you're playing over, in both chord
           modes: the single chord, or the progression's Roman numerals + key.
           They used to live in different places (chord here, progression up in
           the header), so the readout moved when you switched modes. The slot's
           height is reserved, so the grid never shifts; the big single-mode
           chord still overflows it upward, as it always did. -->
      <!-- One explanation, two boxes: the slot's own height is reserved and
           full-width, but what's IN it is either a 40px chord overflowing
           upward or a text-width run of numerals. `data-help-ring` points help
           mode's highlight at whichever child is actually showing, so it rings
           the thing you tapped rather than the reserved space around it. -->
      <div id="chord-head" class="chord-head" data-help="chord-head" data-help-ring=".c, #context">
        <span class="c"></span>
        <span id="context" class="context" hidden></span>
      </div>
      <section id="grid" class="grid" aria-label="Pattern grid" data-help="grid"></section>
    </div>
  </main>

  <!-- The only permanently-visible controls: the things you reach for with a
       guitar in your hands. Everything else lives in the Options sheet. -->
  <div class="controls">
    <!-- Absolute/mixed-bass caution indicator: sits bottom-right, above the gear,
         so the header name row is reserved for the pattern name. -->
    <span id="type-indicator" class="type-indicator" data-help="type-indicator"></span>
    <div class="transport">
      <button id="play" class="btn-icon btn-play" type="button" aria-pressed="false" data-help="play"
              aria-label="Start metronome">&#x25B6;&#xFE0E;</button>
      <div class="slider-wrap" data-help="bpm">
        <input id="bpm" class="bpm-slider" type="range" min="40" max="240" step="1" value="90"
               aria-label="Tempo in beats per minute" />
        <div class="bpm-readout"><!-- No data-help: the lamp sits INSIDE .slider-wrap, so a tap on it walks up
             to the Tempo card. It's a jewel blinking beside a number marked BPM,
             and its one non-obvious job (counting you in) is Play's card. -->
        <span id="beat-lamp" class="beat-lamp" aria-hidden="true"></span><output id="bpm-value" class="bpm-value" for="bpm">90</output> BPM</div>
      </div>
      <button id="generate" class="btn-icon btn-roll" type="button" data-help="generate"
              aria-label="Generate a new pattern" title="Generate">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.2" y="3.2" width="17.6" height="17.6" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8.4" cy="7.4" r="1.4"/><circle cx="8.4" cy="12" r="1.4"/><circle cx="8.4" cy="16.6" r="1.4"/><circle cx="15.6" cy="7.4" r="1.4"/><circle cx="15.6" cy="12" r="1.4"/><circle cx="15.6" cy="16.6" r="1.4"/></svg>
      </button>
      <button id="open-options" class="btn-icon btn-gear" type="button"
              aria-label="Options" title="Options">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.04.24.24.41.47.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.12-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/></svg>
      </button>
    </div>
  </div>

  <!-- Options: generation inputs (set between takes) + app-wide preferences. -->
  <div id="options-sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="options-title">
      <!-- TWO PAGES. The sheet used to hold everything at once and sat at 460px
           of a 487px cap on a 375x553 phone — ~27px spare, i.e. room for zero new
           control rows (a row is 58px). That ceiling had already pushed the die
           onto a section-header line and left the capo nowhere to go. Splitting
           on the natural seam — what the PATTERN is, vs how the APP behaves —
           gives each page ~150px spare.
           The tabs ride the sheet's TITLE line, so the split costs no height at
           all (the version tag moved into the Guide to make the room). -->
      <header class="sheet-head">
        <h2 id="options-title">Options</h2>
        <div class="segmented seg-tabs" role="tablist" aria-label="Options pages">
          <button type="button" role="tab" id="tab-setup" class="active"
                  aria-controls="page-setup" aria-selected="true">Setup</button>
          <button type="button" role="tab" id="tab-prefs"
                  aria-controls="page-prefs" aria-selected="false">Preferences</button>
        </div>
        <button class="sheet-close" type="button" data-close aria-label="Close"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1 1l10 10M11 1L1 11"/></svg></button>
      </header>

      <!-- Both pages occupy the SAME grid cell, so the panel is always as tall as
           the taller one and switching tabs can't make the sheet jump. The
           inactive page is hidden by `visibility` (still occupying its cell), not
           `display`. -->
      <div class="sheet-pages">

      <div class="sheet-page" id="page-setup" role="tabpanel" aria-labelledby="tab-setup">

      <!-- Row 1 is the instrument's CONTEXT — one chord or a progression, and
           where the capo is. Deliberately NOT the die's row (see row 2). -->
      <div class="control-row format-capo">
        <div class="field" data-help="chord-mode">
          <span>Format</span>
          <div id="chord-mode" class="segmented" role="group" aria-label="Chord mode">
            <button type="button" data-mode="single" class="active">Single</button>
            <button type="button" data-mode="progression">Progression</button>
          </div>
        </div>

        <!-- Capo: a shape-first transpose. The grid's frets are SHAPE frets, so
             nothing on screen changes — this shifts the sounding pitch and the
             concert-key readout only. Negative values are a down-tuned guitar
             (the same transform, which a physical capo can't do). -->
        <div class="field" data-help="capo">
          <span>Capo</span>
          <div class="stepper" id="capo">
            <button type="button" data-capo-step="-1" aria-label="Capo down">−</button>
            <output id="capo-value" aria-live="off">0</output>
            <button type="button" data-capo-step="1" aria-label="Capo up">+</button>
          </div>
        </div>
        <!-- The third slot is deliberately EMPTY, and NARROW since v2.14.3 — the
             slack it was holding went to Format, which now spells "Progression"
             out instead of abbreviating it (see .control-row.format-capo). The
             "sounds in" readout used to live here; it moved into the header's
             capo tag (v2.12.0), where the capo state is already reported, so the
             two halves of one fact stopped living on two different screens. The
             slot stays so the row keeps its fixed 3-slot geometry. -->
        <div class="field"></div>
      </div>

      <!-- Row 2 is the die's row, and holds NOTHING else it doesn't re-roll —
           that adjacency is the only thing telling you what the die's scope is.
           Its contents are the only ones that swap between chord modes, and both
           fill the same two slots, so nothing below ever shifts. -->
      <div class="control-row with-die">
        <!-- TWO controls that open ONE panel (v2.14.1, his call): the chord and
             its quality are separate cylinders, so they're separated here too —
             two legends over two wells with a division line between them. The
             <select> underneath is still one control holding one chord id; only
             the trigger's face is split (see chordSplitLabel in wheel.js). -->
        <label class="field span-2 field-split" id="field-chord" data-help="field-chord">
          <span class="split-legends"><span>Chord</span><span>Quality</span></span>
          <select id="chord"></select>
        </label>

        <label class="field" id="field-key" data-help="field-key" hidden>
          <span>Key</span>
          <select id="key"></select>
        </label>
        <label class="field" id="field-prog" data-help="field-prog" hidden>
          <span>Progression</span>
          <select id="progression"></select>
        </label>

        <div class="field field-die">
          <button id="randomize-chords" class="die-btn" type="button" data-help="randomize-chords"
                  aria-label="Random key and progression" title="Random key &amp; progression">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.2" y="3.2" width="17.6" height="17.6" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8.4" cy="7.4" r="1.5"/><circle cx="8.4" cy="16.6" r="1.5"/><circle cx="15.6" cy="7.4" r="1.5"/><circle cx="15.6" cy="16.6" r="1.5"/><circle cx="12" cy="12" r="1.5"/></svg>
          </button>
        </div>
      </div>

      <!-- Thumb and Fingers sit side by side because that IS the model: two
           layers, generated and re-rolled independently. The row's slots are
           UNEVEN (see .control-row.layers) — the Thumb menu has by far the
           longest values and the other two have the shortest. -->
      <div class="control-row layers">
        <label class="field" data-help="bass">
          <span>Thumb</span>
          <select id="bass"></select>
        </label>
        <label class="field" data-help="chaos">
          <span>Fingers</span>
          <select id="chaos"></select>
        </label>
        <label class="field" data-help="pattern">
          <span>Pattern</span>
          <select id="pattern"></select>
        </label>
      </div>

      <!-- Swing. On the Setup page rather than Preferences because this is
           part of what you're PLAYING, not how the app behaves — the same
           reasoning that keeps chord and capo here. It is NOT a generation
           input: the die doesn't roll it and it isn't in the pattern, which is
           why it sits below the die's row rather than in it.

           ONE smooth slider over the whole range, like the BPM one it sits
           below — the user tried five named detents (v2.13.1) and preferred
           this. It swings the "&"s only; the quarters resolution that briefly
           rode beside it here was cut for not being Travis picking. -->
      <div class="control-row">
        <label class="field span-3" id="field-swing" data-help="swing">
          <span>Swing</span>
          <div class="slider-well">
            <input id="swing" class="swing-slider" type="range" min="50" max="75" step="1" value="50"
                   aria-label="Swing amount" aria-valuetext="Straight">
            <output id="swing-value" class="swing-value" for="swing">Straight</output>
          </div>
        </label>
      </div>

      </div><!-- /page-setup -->

      <div class="sheet-page is-away" id="page-prefs" role="tabpanel" aria-labelledby="tab-prefs">

      <p class="sheet-sec">Sound</p>

      <!-- Amp pilot lamps in a 2x2 bank — the jewel lights when the layer is on.
           Metronome / Melody / Count-in are what you hear during play; Buttons is
           the UI press-click (its own on/off). ids are unchanged (click-toggle =
           metronome, pattern-toggle = melody) so the app wiring is untouched. -->
      <div class="lamp-row">
        <label class="lamp" data-help="click-toggle">
          <input id="click-toggle" type="checkbox" checked />
          <span class="jewel"></span>
          <span class="t">Metronome</span>
        </label>
        <label class="lamp" data-help="pattern-toggle">
          <input id="pattern-toggle" type="checkbox" checked />
          <span class="jewel"></span>
          <span class="t">Melody</span>
        </label>
        <label class="lamp" data-help="count-in-toggle">
          <input id="count-in-toggle" type="checkbox" checked />
          <span class="jewel"></span>
          <span class="t">Count-in</span>
        </label>
        <label class="lamp" data-help="ui-sound-toggle">
          <input id="ui-sound-toggle" type="checkbox" checked />
          <span class="jewel"></span>
          <span class="t">Buttons</span>
        </label>
      </div>

      <!-- No "Appearance" caption: these two fields name themselves, the page is
           already called Preferences, and a group caption that looks exactly like
           a field label stacked on top of field labels says nothing. -->
      <div class="control-row">
        <label class="field" data-help="label-mode">
          <span>Note labels</span>
          <select id="label-mode"></select>
        </label>
        <label class="field" data-help="theme">
          <span>Theme</span>
          <select id="theme"></select>
        </label>
      </div>

      </div><!-- /page-prefs -->
      </div><!-- /sheet-pages -->
    </section>
  </div>

  <!-- Saved library: save the current pattern, or load/delete an existing one -->
  <div id="saved-sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="saved-title">
      <header class="sheet-head">
        <h2 id="saved-title">Save</h2>
        <button class="sheet-close" type="button" data-close aria-label="Close"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1 1l10 10M11 1L1 11"/></svg></button>
      </header>

      <div id="save-section">
        <div class="save-row">
          <input id="save-name" type="text" placeholder="Name this pattern" autocomplete="off" />
          <button id="save-btn" class="btn-primary" type="button">Save</button>
        </div>
        <div class="save-hint-row">
          <span id="save-lamp" class="save-lamp" aria-hidden="true"></span>
          <p id="save-hint" class="save-hint"></p>
        </div>
      </div>

      <ul id="saved-list" class="saved-list"></ul>
    </section>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
